name: Publish to the live site

# GitHub Pages serves this site from the gh-pages branch.
# Every push to the working branch is mirrored there, so the live
# site always matches the latest data.

on:
  push:
    branches: [claude/new-website-donmr6, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror this branch to gh-pages
        run: git push origin HEAD:gh-pages --force
