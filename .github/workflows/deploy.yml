name: Publish Pixora to the live site

# GitHub Pages serves the site from the gh-pages branch.
# Every push to the working branch is mirrored there, so the live
# app always matches the latest code.

on:
  push:
    branches: [claude/customer-photo-printing-app-4gm2hv, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror this branch to gh-pages
        run: git push origin HEAD:gh-pages --force
